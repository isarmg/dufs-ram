name: Release Linux binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-linux-binary-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.8.0"
  RUST_TOOLCHAIN: "1.97.1"
  TARGET: x86_64-unknown-linux-gnu
  CARGO_TERM_COLOR: always

jobs:
  verify_build:
    name: Verify and build without write permission
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      release_artifact_id: ${{ steps.upload_release_input.outputs.artifact-id }}
      release_input_digest: ${{ steps.prepare_release_inputs.outputs.release_input_digest }}
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag and source version
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t versions < <(
            sed -n \
              '/^\[package\]$/,/^\[/s/^version = "\([^"]*\)"/\1/p' \
              Cargo.toml
          )
          if ((${#versions[@]} != 1)); then
            printf 'Expected one package version; found %s.\n' \
              "${#versions[@]}" >&2
            exit 1
          fi

          version="${versions[0]}"
          expected_tag="v${version}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ || \
            "$GITHUB_REF_TYPE" != "tag" || \
            "$GITHUB_REF_NAME" != "$expected_tag" ]]
          then
            printf 'Tag %s does not match safe Cargo version %s.\n' \
              "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            printf 'Workflow source commit is not a full object ID.\n' >&2
            exit 1
          fi

          tag_commit="$(
            git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}"
          )"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            printf 'Tag commit %s does not match workflow commit %s.\n' \
              "$tag_commit" "$GITHUB_SHA" >&2
            exit 1
          fi

          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'Validated %s at %s.\n' "$expected_tag" "$tag_commit"

      - name: Require exact-SHA read-only CI and dependency audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          require_successful_run() {
            local workflow="$1"
            local label="$2"
            local run_id=""
            local runs=""
            local run_state=""

            for _ in {1..60}; do
              runs="$(
                gh run list \
                  --workflow "$workflow" \
                  --branch "$GITHUB_REF_NAME" \
                  --commit "$GITHUB_SHA" \
                  --event push \
                  --limit 20 \
                  --json databaseId,createdAt,event,headBranch,headSha
              )"
              run_id="$(
                jq -r \
                  --arg sha "$GITHUB_SHA" \
                  --arg ref "$GITHUB_REF_NAME" \
                  '[.[] | select(
                    .headSha == $sha and
                    .headBranch == $ref and
                    .event == "push"
                  )] | sort_by(.createdAt) | last | .databaseId // empty' \
                  <<< "$runs"
              )"
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 5
            done

            if [[ -z "$run_id" ]]; then
              printf 'No %s run appeared for tag %s at exact commit %s.\n' \
                "$label" "$GITHUB_REF_NAME" "$GITHUB_SHA" >&2
              return 1
            fi

            printf 'Waiting for %s run %s.\n' "$label" "$run_id"
            gh run watch "$run_id" --exit-status --interval 10
            run_state="$(
              gh run view "$run_id" \
                --json conclusion,event,headBranch,headSha,status
            )"
            if ! jq -e \
              --arg sha "$GITHUB_SHA" \
              --arg ref "$GITHUB_REF_NAME" \
              '.headSha == $sha and
               .headBranch == $ref and
               .event == "push" and
               .status == "completed" and
               .conclusion == "success"' \
              <<< "$run_state" >/dev/null
            then
              printf '%s run %s did not succeed for the exact tag commit.\n' \
                "$label" "$run_id" >&2
              return 1
            fi
          }

          require_successful_run read-only-ci.yml 'read-only CI'
          require_successful_run dependency-audit.yml 'dependency audit'

      - name: Install the fixed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustc +"$RUST_TOOLCHAIN" --version --verbose
          cargo +"$RUST_TOOLCHAIN" --version --verbose

      - name: Use the fixed Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Build the release binary
        shell: bash
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          env \
            CARGO_INCREMENTAL=0 \
            DUFS_BUILD_GIT_SHA="$GITHUB_SHA" \
            SOURCE_DATE_EPOCH="$source_date_epoch" \
            TZ=UTC \
            ZERO_AR_DATE=1 \
            cargo +"$RUST_TOOLCHAIN" build \
              --locked \
              --release \
              --target "$TARGET"

      - name: Prepare and verify fixed release inputs
        id: prepare_release_inputs
        shell: bash
        run: |
          set -euo pipefail

          asset_name="dufs-${VERSION}-${TARGET}"
          source_binary="target/${TARGET}/release/dufs"
          install -d -m 0755 dist
          install -m 0755 "$source_binary" "dist/$asset_name"

          expected_version="dufs $VERSION (git $GITHUB_SHA)"
          actual_version="$("dist/$asset_name" --version)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            printf 'Expected version %s; found %s.\n' \
              "$expected_version" "$actual_version" >&2
            exit 1
          fi

          ldd_output="$(ldd "dist/$asset_name")"
          printf '%s\n' "$ldd_output"
          if [[ "$ldd_output" == *"not found"* ]]; then
            printf 'The release binary has unresolved shared libraries.\n' >&2
            exit 1
          fi

          (
            cd dist
            sha256sum "$asset_name" > "$asset_name.sha256"
            sha256sum --check "$asset_name.sha256"
          )
          node scripts/extract-release-notes.mjs \
            CHANGELOG.md "$VERSION" > dist/RELEASE_NOTES.md
          test -s dist/RELEASE_NOTES.md

          entry_count="$(find -P dist -mindepth 1 -printf x | wc -c)"
          if [[ "$entry_count" != "3" ]]; then
            printf 'Expected exactly three release inputs; found %s.\n' \
              "$entry_count" >&2
            exit 1
          fi
          release_input_digest="$(
            (
              cd dist
              sha256sum \
                "$asset_name" \
                "$asset_name.sha256" \
                RELEASE_NOTES.md
            ) | sha256sum | awk '{print $1}'
          )"
          printf 'release_input_digest=%s\n' "$release_input_digest" \
            >> "$GITHUB_OUTPUT"

      - name: Transfer the verified release inputs
        id: upload_release_input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  publish:
    name: Publish verified inputs with contents write only
    needs: verify_build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download the exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify_build.outputs.release_artifact_id }}
          path: ${{ runner.temp }}/github-release-input
          digest-mismatch: error

      - name: Validate, recover, and publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_RELEASE_INPUT_DIGEST: ${{ needs.verify_build.outputs.release_input_digest }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          title="Dufs $version"
          input_dir="${RUNNER_TEMP}/github-release-input"
          work_dir="$(mktemp -d "${RUNNER_TEMP}/dufs-release.XXXXXX")"
          trap 'rm -rf -- "$work_dir"' EXIT

          if [[ "$GITHUB_REF_TYPE" != "tag" || \
            ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ || \
            "$tag" != "v${version}" ]]
          then
            printf 'Unsafe or inconsistent release tag: %s.\n' "$tag" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            printf 'Workflow source commit is not a full object ID.\n' >&2
            exit 1
          fi
          if [[ ! "$GH_REPO" =~ ^[0-9A-Za-z_.-]+/[0-9A-Za-z_.-]+$ ]]; then
            printf 'Unexpected repository name: %s.\n' "$GH_REPO" >&2
            exit 1
          fi

          asset_name="dufs-${version}-${TARGET}"
          checksum_name="${asset_name}.sha256"
          notes_name="RELEASE_NOTES.md"
          asset_path="$input_dir/$asset_name"
          checksum_path="$input_dir/$checksum_name"
          notes_path="$input_dir/$notes_name"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          if [[ ! -d "$input_dir" || -L "$input_dir" ]]; then
            printf 'Release input directory is missing or unsafe.\n' >&2
            exit 1
          fi
          entry_count="$(find -P "$input_dir" -mindepth 1 -printf x | wc -c)"
          if [[ "$entry_count" != "3" ]]; then
            printf 'Expected exactly three artifact entries; found %s.\n' \
              "$entry_count" >&2
            exit 1
          fi
          for path in "$asset_path" "$checksum_path" "$notes_path"; do
            if [[ ! -f "$path" || -L "$path" || \
              "$(stat -c %h "$path")" != "1" ]]
            then
              printf 'Release input is not a single-link regular file: %s.\n' \
                "$path" >&2
              exit 1
            fi
          done
          asset_size="$(stat -c %s "$asset_path")"
          notes_size="$(stat -c %s "$notes_path")"
          if ((asset_size == 0 || asset_size > 268435456)); then
            printf 'Release binary size is outside the accepted range.\n' >&2
            exit 1
          fi
          if ((notes_size == 0 || notes_size > 1048576)); then
            printf 'Release notes size is outside the accepted range.\n' >&2
            exit 1
          fi

          local_digest="$(sha256sum "$asset_path" | awk '{print $1}')"
          printf '%s  %s\n' "$local_digest" "$asset_name" \
            > "$work_dir/expected.sha256"
          if ! cmp -s "$work_dir/expected.sha256" "$checksum_path"; then
            printf 'Transferred checksum does not describe the fixed binary.\n' >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_RELEASE_INPUT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'Build job did not provide a valid release-input digest.\n' >&2
            exit 1
          fi
          actual_release_input_digest="$(
            (
              cd "$input_dir"
              sha256sum "$asset_name" "$checksum_name" "$notes_name"
            ) | sha256sum | awk '{print $1}'
          )"
          if [[ "$actual_release_input_digest" != \
            "$EXPECTED_RELEASE_INPUT_DIGEST" ]]
          then
            printf 'Downloaded release inputs do not match the build digest.\n' >&2
            exit 1
          fi

          verify_tag_target() {
            local remote_sha=""
            remote_sha="$(
              gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha
            )"
            if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
              printf 'Remote tag %s resolves to %s, expected %s.\n' \
                "$tag" "$remote_sha" "$GITHUB_SHA" >&2
              return 1
            fi
          }

          verify_tag_target
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Release %s already exists; refusing to replace it.\n' \
              "$tag" >&2
            exit 1
          fi

          create_flags=(
            --verify-tag
            --draft
            --title "$title"
            --notes-file "$notes_path"
          )
          if [[ "$prerelease" == "true" ]]; then
            create_flags+=(--prerelease)
          fi
          gh release create "$tag" "${create_flags[@]}"
          verify_tag_target
          gh release upload "$tag" "$asset_path" "$checksum_path"

          expected_assets="$(
            printf '%s\n' "$asset_name" "$checksum_name" | sort
          )"
          actual_assets="$(
            gh release view "$tag" --json assets --jq '.assets[].name' | sort
          )"
          is_draft="$(
            gh release view "$tag" --json isDraft --jq .isDraft
          )"
          if [[ "$is_draft" != "true" || \
            "$actual_assets" != "$expected_assets" ]]
          then
            printf 'Draft release verification failed.\n' >&2
            exit 1
          fi

          verify_tag_target
          latest_flags=(--latest)
          if [[ "$prerelease" == "true" ]]; then
            latest_flags=(--latest=false)
          fi
          gh release edit "$tag" --draft=false "${latest_flags[@]}"
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != \
            "false" ]]
          then
            printf 'Release %s remained a draft.\n' "$tag" >&2
            exit 1
          fi
          verify_tag_target
