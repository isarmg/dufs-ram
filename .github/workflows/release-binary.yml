name: Release Linux binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-linux-binary-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26.7.0"
  RUST_TOOLCHAIN: "1.98.0"
  CARGO_AUDIT_VERSION: "0.22.2"
  TARGET: x86_64-unknown-linux-gnu
  CARGO_TERM_COLOR: always

jobs:
  verify_build:
    name: Verify and build without write permission
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    outputs:
      release_artifact_id: ${{ steps.upload_release_input.outputs.artifact-id }}
      release_input_digest: ${{ steps.prepare_release_inputs.outputs.release_input_digest }}
      verification_run_attempt: ${{ steps.record_verification_attempt.outputs.run_attempt }}
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag and source version
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t versions < <(
            sed -n \
              '/^\[package\]$/,/^\[/s/^version = "\([^"]*\)"/\1/p' \
              Cargo.toml
          )
          if ((${#versions[@]} != 1)); then
            printf 'Expected one package version; found %s.\n' \
              "${#versions[@]}" >&2
            exit 1
          fi

          version="${versions[0]}"
          expected_tag="v${version}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ || \
            "$GITHUB_REF_TYPE" != "tag" || \
            "$GITHUB_REF_NAME" != "$expected_tag" ]]
          then
            printf 'Tag %s does not match safe Cargo version %s.\n' \
              "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            printf 'Workflow source commit is not a full object ID.\n' >&2
            exit 1
          fi

          tag_commit="$(
            git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}"
          )"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            printf 'Tag commit %s does not match workflow commit %s.\n' \
              "$tag_commit" "$GITHUB_SHA" >&2
            exit 1
          fi

          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'Validated %s at %s.\n' "$expected_tag" "$tag_commit"

      - name: Require exact-SHA read-only CI and dependency audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh --version
          jq --version

          require_successful_run() {
            local workflow="$1"
            local label="$2"
            local run_id=""
            local runs=""
            local run_state=""

            for _ in {1..60}; do
              runs="$(
                gh run list \
                  --workflow "$workflow" \
                  --branch "$GITHUB_REF_NAME" \
                  --commit "$GITHUB_SHA" \
                  --event push \
                  --limit 20 \
                  --json databaseId,createdAt,event,headBranch,headSha
              )"
              run_id="$(
                jq -r \
                  --arg sha "$GITHUB_SHA" \
                  --arg ref "$GITHUB_REF_NAME" \
                  '[.[] | select(
                    .headSha == $sha and
                    .headBranch == $ref and
                    .event == "push"
                  )] | sort_by(.createdAt) | last | .databaseId // empty' \
                  <<< "$runs"
              )"
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 5
            done

            if [[ -z "$run_id" ]]; then
              printf 'No %s run appeared for tag %s at exact commit %s.\n' \
                "$label" "$GITHUB_REF_NAME" "$GITHUB_SHA" >&2
              return 1
            fi

            printf 'Waiting for %s run %s.\n' "$label" "$run_id"
            gh run watch "$run_id" --exit-status --interval 10
            run_state="$(
              gh run view "$run_id" \
                --json conclusion,event,headBranch,headSha,status
            )"
            if ! jq -e \
              --arg sha "$GITHUB_SHA" \
              --arg ref "$GITHUB_REF_NAME" \
              '.headSha == $sha and
               .headBranch == $ref and
               .event == "push" and
               .status == "completed" and
               .conclusion == "success"' \
              <<< "$run_state" >/dev/null
            then
              printf '%s run %s did not succeed for the exact tag commit.\n' \
                "$label" "$run_id" >&2
              return 1
            fi
          }

          require_successful_run read-only-ci.yml 'read-only CI'
          require_successful_run dependency-audit.yml 'dependency audit'
          require_successful_run formal-release-e2e.yml 'formal release package E2E'

      - name: Install the fixed Rust toolchain and cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cargo +"$RUST_TOOLCHAIN" install cargo-audit \
            --version "$CARGO_AUDIT_VERSION" \
            --locked
          rustc +"$RUST_TOOLCHAIN" --version --verbose
          cargo +"$RUST_TOOLCHAIN" --version --verbose
          test "$(cargo audit --version)" = \
            "cargo-audit-audit $CARGO_AUDIT_VERSION"

      - name: Use the fixed Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Audit dependencies for this release attempt
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo audit --deny yanked
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npm run build:platform

      - name: Build the release binary
        shell: bash
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          env \
            CARGO_INCREMENTAL=0 \
            DUFS_BUILD_GIT_SHA="$GITHUB_SHA" \
            SOURCE_DATE_EPOCH="$source_date_epoch" \
            TZ=UTC \
            ZERO_AR_DATE=1 \
            cargo +"$RUST_TOOLCHAIN" build \
              --locked \
              --release \
              --target "$TARGET"

      - name: Prepare and verify fixed release inputs
        id: prepare_release_inputs
        shell: bash
        run: |
          set -euo pipefail

          asset_name="dufs-${VERSION}-${TARGET}"
          source_binary="target/${TARGET}/release/dufs"
          install -d -m 0755 dist
          install -m 0755 "$source_binary" "dist/$asset_name"

          expected_version="dufs $VERSION (git $GITHUB_SHA)"
          actual_version="$("dist/$asset_name" --version)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            printf 'Expected version %s; found %s.\n' \
              "$expected_version" "$actual_version" >&2
            exit 1
          fi

          ldd_output="$(ldd "dist/$asset_name")"
          printf '%s\n' "$ldd_output"
          if [[ "$ldd_output" == *"not found"* ]]; then
            printf 'The release binary has unresolved shared libraries.\n' >&2
            exit 1
          fi

          (
            cd dist
            sha256sum "$asset_name" > "$asset_name.sha256"
            sha256sum --check "$asset_name.sha256"
          )
          {
            printf '# Dufs %s\n\n' "$VERSION"
            printf 'Source commit: `%s`\n' "$GITHUB_SHA"
          } > dist/RELEASE_NOTES.md
          test -s dist/RELEASE_NOTES.md

          entry_count="$(find -P dist -mindepth 1 -printf x | wc -c)"
          if [[ "$entry_count" != "3" ]]; then
            printf 'Expected exactly three release inputs; found %s.\n' \
              "$entry_count" >&2
            exit 1
          fi
          release_input_digest="$(
            (
              cd dist
              sha256sum \
                "$asset_name" \
                "$asset_name.sha256" \
                RELEASE_NOTES.md
            ) | sha256sum | awk '{print $1}'
          )"
          printf 'release_input_digest=%s\n' "$release_input_digest" \
            >> "$GITHUB_OUTPUT"

      - name: Transfer the verified release inputs
        id: upload_release_input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Record the successful verification attempt
        id: record_verification_attempt
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            printf 'Workflow run attempt is invalid: %s.\n' \
              "$GITHUB_RUN_ATTEMPT" >&2
            exit 1
          fi
          printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish verified inputs with contents write only
    needs: verify_build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Require verification from this workflow attempt
        shell: bash
        env:
          VERIFIED_RUN_ATTEMPT: ${{ needs.verify_build.outputs.verification_run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
            ! "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || \
            "$VERIFIED_RUN_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]
          then
            printf '%s\n' \
              'Publishing requires verification from this workflow attempt; use Re-run all jobs.' >&2
            exit 1
          fi

      - name: Download the exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify_build.outputs.release_artifact_id }}
          path: ${{ runner.temp }}/github-release-input
          digest-mismatch: error

      - name: Validate, recover, and publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_RELEASE_INPUT_DIGEST: ${{ needs.verify_build.outputs.release_input_digest }}
        run: |
          set -euo pipefail
          gh --version
          jq --version

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          title="Dufs $version"
          input_dir="${RUNNER_TEMP}/github-release-input"
          work_dir="$(mktemp -d "${RUNNER_TEMP}/dufs-release.XXXXXX")"
          trap 'rm -rf -- "$work_dir"' EXIT
          release_state="$work_dir/release.json"
          release_rest_state="$work_dir/release-rest.json"
          release_asset_pages="$work_dir/release-asset-pages.json"
          release_assets_state="$work_dir/release-assets.json"

          if [[ "$GITHUB_REF_TYPE" != "tag" || \
            ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ || \
            "$tag" != "v${version}" ]]
          then
            printf 'Unsafe or inconsistent release tag: %s.\n' "$tag" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            printf 'Workflow source commit is not a full object ID.\n' >&2
            exit 1
          fi
          if [[ ! "$GH_REPO" =~ ^[0-9A-Za-z_.-]+/[0-9A-Za-z_.-]+$ ]]; then
            printf 'Unexpected repository name: %s.\n' "$GH_REPO" >&2
            exit 1
          fi

          asset_name="dufs-${version}-${TARGET}"
          checksum_name="${asset_name}.sha256"
          notes_name="RELEASE_NOTES.md"
          asset_path="$input_dir/$asset_name"
          checksum_path="$input_dir/$checksum_name"
          notes_path="$input_dir/$notes_name"
          repository_owner="${GH_REPO%%/*}"
          repository_name="${GH_REPO#*/}"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          if [[ ! -d "$input_dir" || -L "$input_dir" ]]; then
            printf 'Release input directory is missing or unsafe.\n' >&2
            exit 1
          fi
          entry_count="$(find -P "$input_dir" -mindepth 1 -printf x | wc -c)"
          if [[ "$entry_count" != "3" ]]; then
            printf 'Expected exactly three artifact entries; found %s.\n' \
              "$entry_count" >&2
            exit 1
          fi
          for path in "$asset_path" "$checksum_path" "$notes_path"; do
            if [[ ! -f "$path" || -L "$path" || \
              "$(stat -c %h "$path")" != "1" ]]
            then
              printf 'Release input is not a single-link regular file: %s.\n' \
                "$path" >&2
              exit 1
            fi
          done
          asset_size="$(stat -c %s "$asset_path")"
          checksum_size="$(stat -c %s "$checksum_path")"
          notes_size="$(stat -c %s "$notes_path")"
          if ((asset_size == 0 || asset_size > 268435456)); then
            printf 'Release binary size is outside the accepted range.\n' >&2
            exit 1
          fi
          if ((notes_size == 0 || notes_size > 1048576)); then
            printf 'Release notes size is outside the accepted range.\n' >&2
            exit 1
          fi

          local_digest="$(sha256sum "$asset_path" | awk '{print $1}')"
          checksum_digest="$(sha256sum "$checksum_path" | awk '{print $1}')"
          printf '%s  %s\n' "$local_digest" "$asset_name" \
            > "$work_dir/expected.sha256"
          if ! cmp -s "$work_dir/expected.sha256" "$checksum_path"; then
            printf 'Transferred checksum does not describe the fixed binary.\n' >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_RELEASE_INPUT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'Build job did not provide a valid release-input digest.\n' >&2
            exit 1
          fi
          actual_release_input_digest="$(
            (
              cd "$input_dir"
              sha256sum "$asset_name" "$checksum_name" "$notes_name"
            ) | sha256sum | awk '{print $1}'
          )"
          if [[ "$actual_release_input_digest" != \
            "$EXPECTED_RELEASE_INPUT_DIGEST" ]]
          then
            printf 'Downloaded release inputs do not match the build digest.\n' >&2
            exit 1
          fi

          release_query='query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){databaseId tagName name description isDraft isPrerelease}}}'

          verify_tag_target() {
            local remote_sha=""
            if ! remote_sha="$(
              gh api "repos/${GH_REPO}/commits/${tag}" --jq .sha
            )"
            then
              printf 'Unable to resolve remote tag %s.\n' "$tag" >&2
              return 2
            fi
            if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
              printf 'Remote tag %s resolves to %s, expected %s.\n' \
                "$tag" "$remote_sha" "$GITHUB_SHA" >&2
              return 1
            fi
          }

          read_release() {
            local release_id=""
            local release_missing=""

            if ! gh api graphql \
              -f query="$release_query" \
              -F owner="$repository_owner" \
              -F name="$repository_name" \
              -F tag="$tag" \
              > "$release_state"
            then
              return 2
            fi
            release_missing="$(
              jq -r '.data.repository.release == null' "$release_state"
            )" || return 2
            if [[ "$release_missing" == "true" ]]
            then
              printf '{}\n' > "$release_rest_state"
              printf '[]\n' > "$release_assets_state"
              return 0
            fi
            if [[ "$release_missing" != "false" ]]; then
              printf 'GraphQL release lookup returned an invalid state.\n' >&2
              return 2
            fi
            release_id="$(
              jq -er '
                .data.repository.release.databaseId as $id |
                select(
                  ($id | type) == "number" and
                  $id > 0 and
                  $id <= 2147483647 and
                  ($id | floor) == $id
                ) |
                $id | tostring
              ' "$release_state"
            )" || {
              printf 'GraphQL release ID is invalid.\n' >&2
              return 2
            }
            if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
              printf 'Release ID is invalid.\n' >&2
              return 2
            fi
            if ! gh api "repos/${GH_REPO}/releases/${release_id}" \
              > "$release_rest_state"
            then
              return 2
            fi
            if ! jq -e \
              --arg release_id "$release_id" \
              '(.id | type) == "number" and
               (.id | tostring) == $release_id' \
              "$release_rest_state" >/dev/null
            then
              printf 'GraphQL and REST release IDs do not match.\n' >&2
              return 2
            fi
            if ! gh api --paginate --slurp \
              "repos/${GH_REPO}/releases/${release_id}/assets?per_page=100" \
              > "$release_asset_pages"
            then
              return 2
            fi
            if ! jq -e \
              'type == "array" and all(.[]; type == "array")' \
              "$release_asset_pages" >/dev/null
            then
              printf 'Release asset pages have an invalid shape.\n' >&2
              return 2
            fi
            jq 'add // []' "$release_asset_pages" \
              > "$release_assets_state" || return 2
          }

          validate_release_metadata() {
            local graphql_draft=""

            if ! jq -e \
              --arg tag "$tag" \
              --arg title "$title" \
              --argjson prerelease "$prerelease" \
              '.data.repository.release != null and
               .data.repository.release.tagName == $tag and
               .data.repository.release.name == $title and
               .data.repository.release.isPrerelease == $prerelease' \
              "$release_state" >/dev/null
            then
              printf 'Existing release metadata does not match this run.\n' >&2
              return 1
            fi
            graphql_draft="$(
              jq -r '.data.repository.release.isDraft' "$release_state"
            )" || return 2
            if [[ "$graphql_draft" != "true" && "$graphql_draft" != "false" ]]; then
              printf 'GraphQL release draft state is invalid.\n' >&2
              return 2
            fi
            if ! jq -e \
              --arg tag "$tag" \
              --arg title "$title" \
              --argjson prerelease "$prerelease" \
              --argjson draft "$graphql_draft" \
              '.tag_name == $tag and
               .name == $title and
               .prerelease == $prerelease and
               .draft == $draft' \
              "$release_rest_state" >/dev/null
            then
              printf 'REST release metadata does not match this run.\n' >&2
              return 1
            fi
            if ! jq -j '.data.repository.release.description // ""' \
              "$release_state" > "$work_dir/remote-notes.md"
            then
              return 2
            fi
            if ! cmp -s "$work_dir/remote-notes.md" "$notes_path"; then
              printf 'Existing release notes do not match source-bound notes.\n' >&2
              return 1
            fi
            if ! jq -j '.body // ""' "$release_rest_state" \
              > "$work_dir/remote-rest-notes.md"
            then
              return 2
            fi
            if ! cmp -s "$work_dir/remote-rest-notes.md" "$notes_path"; then
              printf 'REST release notes do not match source-bound notes.\n' >&2
              return 1
            fi
          }

          validate_draft_asset_subset() {
            if ! jq -e \
              --arg asset "$asset_name" \
              --arg checksum "$checksum_name" \
              '. as $assets |
               ($assets | length) <= 2 and
               ([ $assets[].name ] | unique | length) == ($assets | length) and
               ([ $assets[].name ] |
                 all(. == $asset or . == $checksum))' \
              "$release_assets_state" >/dev/null
            then
              printf 'Draft contains duplicate or unexpected release assets.\n' >&2
              return 1
            fi
          }

          validate_complete_asset_set() {
            if ! jq -e \
              --arg asset "$asset_name" \
              --arg checksum "$checksum_name" \
              --arg asset_digest "sha256:$local_digest" \
              --arg checksum_digest "sha256:$checksum_digest" \
              --argjson asset_size "$asset_size" \
              --argjson checksum_size "$checksum_size" \
              '. as $assets |
               ($assets | length) == 2 and
               ([ $assets[].name ] | sort) == ([$asset, $checksum] | sort) and
               all($assets[]; .state == "uploaded") and
               ([ $assets[] | select(.name == $asset) | .size ] == [$asset_size]) and
               ([ $assets[] | select(.name == $checksum) | .size ] == [$checksum_size]) and
               ([ $assets[] | select(.name == $asset) | .digest ] == [$asset_digest]) and
               ([ $assets[] | select(.name == $checksum) | .digest ] == [$checksum_digest])' \
              "$release_assets_state" >/dev/null
            then
              printf 'Release does not contain exactly the two fixed assets.\n' >&2
              return 1
            fi
          }

          asset_exists() {
            local name="$1"
            jq -e \
              --arg name "$name" \
              '.[] | select(.name == $name)' \
              "$release_assets_state" >/dev/null
          }

          require_matching_draft() {
            if ! read_release; then
              printf 'Unable to refresh the release draft.\n' >&2
              return 2
            fi
            validate_release_metadata || return 1
            if [[ "$(jq -r .draft "$release_rest_state")" != \
              "true" ]]
            then
              printf 'Release is no longer the matching mutable draft.\n' >&2
              return 1
            fi
            validate_draft_asset_subset || return 1
            verify_tag_target || return 1
          }

          require_complete_matching_draft() {
            require_matching_draft || return $?
            validate_complete_asset_set || return 1
          }

          compare_remote_asset() {
            local name="$1"
            local local_path="$2"
            local download_dir=""
            local remote_path=""
            local remote_digest=""
            local expected_digest=""
            local count=""

            download_dir="$(mktemp -d "$work_dir/download.XXXXXX")" || return 2
            if ! gh release download "$tag" \
              --pattern "$name" \
              --dir "$download_dir"
            then
              printf 'Unable to download remote asset %s.\n' "$name" >&2
              return 2
            fi
            remote_path="$download_dir/$name"
            count="$(
              find -P "$download_dir" -mindepth 1 -printf x | wc -c
            )" || return 2
            if [[ "$count" != "1" || ! -f "$remote_path" || \
              -L "$remote_path" || "$(stat -c %h "$remote_path")" != "1" ]]
            then
              printf 'Downloaded remote asset %s has an unsafe shape.\n' \
                "$name" >&2
              return 2
            fi
            remote_digest="$(
              sha256sum "$remote_path" | awk '{print $1}'
            )" || return 2
            expected_digest="$(
              sha256sum "$local_path" | awk '{print $1}'
            )" || return 2
            printf 'Remote %s SHA-256: %s\n' "$name" "$remote_digest"
            if [[ "$remote_digest" != "$expected_digest" ]] || \
              ! cmp -s "$remote_path" "$local_path"
            then
              printf 'Expected %s SHA-256: %s\n' \
                "$name" "$expected_digest" >&2
              return 1
            fi
            rm -rf -- "$download_dir"
            return 0
          }

          remove_stable_starter_asset() {
            local name="$1"
            local first="$work_dir/starter-first.json"
            local second="$work_dir/starter-second.json"
            local current="$work_dir/starter-current.json"
            local first_signature=""
            local second_signature=""
            local current_list_signature=""
            local asset_id=""
            local delete_response=""
            local status_line=""

            require_matching_draft || return $?
            if ! jq -e \
              --arg name "$name" \
              '[.[] | select(.name == $name)] |
               if length == 1 then .[0] else empty end' \
              "$release_assets_state" > "$first"
            then
              printf 'Unable to inspect interrupted asset %s.\n' "$name" >&2
              return 1
            fi
            if ! jq -e \
              --arg name "$name" \
              '.name == $name and
               .state == "starter" and
               .size == 0 and
               (.id | type == "number")' \
              "$first" >/dev/null
            then
              printf 'Mismatched asset %s is not a removable empty starter.\n' \
                "$name" >&2
              return 1
            fi
            first_signature="$(jq -c '{id,name,state,size}' "$first")" || return 2

            sleep 5
            require_matching_draft || return $?
            if ! jq -e \
              --arg name "$name" \
              '[.[] | select(.name == $name)] |
               if length == 1 then .[0] else empty end' \
              "$release_assets_state" > "$second"
            then
              printf 'Unable to re-inspect interrupted asset %s.\n' "$name" >&2
              return 1
            fi
            if ! jq -e \
              --arg name "$name" \
              '.name == $name and
               .state == "starter" and
               .size == 0 and
               (.id | type == "number")' \
              "$second" >/dev/null
            then
              printf 'Interrupted asset %s changed during validation.\n' \
                "$name" >&2
              return 1
            fi
            second_signature="$(jq -c '{id,name,state,size}' "$second")" || return 2
            if [[ "$first_signature" != "$second_signature" ]]; then
              printf 'Interrupted asset %s changed identity or state.\n' \
                "$name" >&2
              return 1
            fi

            asset_id="$(jq -r .id "$second")" || return 2
            if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
              printf 'Interrupted asset ID is invalid.\n' >&2
              return 1
            fi
            require_matching_draft || return $?
            current_list_signature="$(
              jq -c \
                --arg name "$name" \
                '[.[] | select(.name == $name)] |
                 if length == 1 then .[0] | {id,name,state,size} else empty end' \
                "$release_assets_state"
            )" || return 1
            if [[ "$current_list_signature" != "$second_signature" ]]; then
              printf 'Interrupted asset %s changed before final inspection.\n' \
                "$name" >&2
              return 1
            fi
            if ! gh api "repos/${GH_REPO}/releases/assets/${asset_id}" \
              > "$current"
            then
              printf 'Interrupted asset %s disappeared before deletion.\n' \
                "$name" >&2
              return 2
            fi
            if ! jq -e \
              --arg name "$name" \
              --arg id "$asset_id" \
              '(.id | tostring) == $id and
               .name == $name and
               .state == "starter" and
               .size == 0' \
              "$current" >/dev/null
            then
              printf 'Interrupted asset %s changed before deletion.\n' \
                "$name" >&2
              return 1
            fi

            verify_tag_target || return 1
            if ! delete_response="$(
              gh api --include --method DELETE \
                "repos/${GH_REPO}/releases/assets/${asset_id}"
            )"
            then
              printf 'Unable to delete interrupted asset ID %s.\n' \
                "$asset_id" >&2
              return 2
            fi
            status_line="${delete_response%%$'\n'*}"
            if [[ ! "$status_line" =~ ^HTTP/[0-9.]+[[:space:]]+204([[:space:]]|$) ]]; then
              printf 'Deleting interrupted asset ID %s did not return 204.\n' \
                "$asset_id" >&2
              return 2
            fi

            require_matching_draft || return $?
            if asset_exists "$name"; then
              printf 'Deleted interrupted asset %s is still present.\n' \
                "$name" >&2
              return 2
            fi
            printf 'Removed stable empty starter asset %s by ID %s.\n' \
              "$name" "$asset_id"
          }

          recover_interrupted_asset() {
            local name="$1"
            local local_path="$2"
            local comparison_status="$3"
            local cleanup_status=0

            printf 'Draft asset %s could not be verified; checking starter state.\n' \
              "$name" >&2
            if remove_stable_starter_asset "$name"; then
              require_matching_draft || return $?
              gh release upload "$tag" "$local_path" || return 2
              return 0
            else
              cleanup_status=$?
            fi
            if ((cleanup_status == 2)); then
              return 2
            fi
            return "$comparison_status"
          }

          sync_draft_asset() {
            local name="$1"
            local local_path="$2"
            local comparison_status=0

            require_matching_draft
            if asset_exists "$name"; then
              if compare_remote_asset "$name" "$local_path"; then
                printf 'Keeping verified draft asset %s.\n' "$name"
                return 0
              else
                comparison_status=$?
              fi
              recover_interrupted_asset \
                "$name" "$local_path" "$comparison_status"
              return
            fi

            require_matching_draft
            if asset_exists "$name"; then
              if compare_remote_asset "$name" "$local_path"; then
                printf 'Keeping concurrently uploaded draft asset %s.\n' "$name"
                return 0
              else
                comparison_status=$?
              fi
              recover_interrupted_asset \
                "$name" "$local_path" "$comparison_status"
              return
            fi
            gh release upload "$tag" "$local_path"
          }

          verify_complete_release() {
            read_release
            validate_release_metadata
            validate_complete_asset_set
            compare_remote_asset "$asset_name" "$asset_path"
            compare_remote_asset "$checksum_name" "$checksum_path"
          }

          verify_tag_target
          read_release
          if [[ "$(jq -r '.data.repository.release == null' "$release_state")" == "true" ]]; then
            create_flags=(
              --verify-tag
              --draft
              --title "$title"
              --notes-file "$notes_path"
            )
            if [[ "$prerelease" == "true" ]]; then
              create_flags+=(--prerelease)
            fi
            verify_tag_target
            gh release create "$tag" "${create_flags[@]}"
            read_release
          fi

          validate_release_metadata
          if [[ "$(jq -r .draft "$release_rest_state")" == "false" ]]; then
            verify_tag_target
            verify_complete_release
            verify_tag_target
            printf 'Published release %s already matches this exact run.\n' "$tag"
            exit 0
          fi
          if [[ "$(jq -r .draft "$release_rest_state")" != "true" ]]; then
            printf 'Release draft state is invalid.\n' >&2
            exit 1
          fi

          validate_draft_asset_subset
          sync_draft_asset "$asset_name" "$asset_path"
          sync_draft_asset "$checksum_name" "$checksum_path"

          verify_complete_release
          require_complete_matching_draft
          latest_flags=(--latest)
          if [[ "$prerelease" == "true" ]]; then
            latest_flags=(--latest=false)
          fi
          gh release edit "$tag" --draft=false "${latest_flags[@]}"

          verify_complete_release
          if [[ "$(jq -r .draft "$release_rest_state")" != "false" ]]; then
            printf 'Release %s remained a draft.\n' "$tag" >&2
            exit 1
          fi
          verify_tag_target
