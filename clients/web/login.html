<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Sign in</title>
  <link rel="stylesheet" href="/__ASSETS_PREFIX__login.css">
</head>

<body>
  <main class="login-screen">
    <form class="content-card login-card" aria-label="Sign in to Dufs" novalidate>
      <div class="card-inner">
        <div class="card-row">
          <label class="card-row-label" for="username">
            <span class="login-label-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            Username
          </label>
          <div class="card-row-content"></div>
        </div>
        <div class="card-row input-row">
          <div class="card-row-content">
            <input class="login-input" id="username" name="username" type="text" maxlength="64"
              autocomplete="username" autocapitalize="none" spellcheck="false" aria-label="Username"
              required autofocus>
          </div>
        </div>
        <div class="card-row">
          <label class="card-row-label" for="password">
            <span class="login-label-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect width="18" height="11" x="3" y="11" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            Password
          </label>
          <div class="card-row-content"></div>
        </div>
        <div class="card-row input-row">
          <div class="card-row-content">
            <input class="login-input" id="password" name="password" type="password"
              data-min-bytes="__MIN_PASSWORD_BYTES__" data-max-bytes="__MAX_PASSWORD_BYTES__"
              autocomplete="current-password" aria-label="Password" required>
          </div>
        </div>
        <div class="card-row error-row hidden" role="alert">
          <div class="card-row-content">
            <span class="login-error"></span>
          </div>
        </div>
        <div class="card-row">
          <span class="card-row-label">
            <span class="login-label-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m10 17 5-5-5-5"></path>
                <path d="M15 12H3"></path>
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              </svg>
            </span>
            Action
          </span>
          <div class="card-row-content">
            <div class="card-actions">
              <button class="card-action-button primary" type="submit">Sign in</button>
            </div>
          </div>
        </div>
      </div>
    </form>
  </main>
  <script>__LOGIN_SCRIPT__</script>
</body>

</html>
