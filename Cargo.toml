[package]
name = "dufs"
version = "0.50.1"
edition = "2024"
rust-version = "1.98"
description = "A Linux browser file manager"
authors = ["sigoden <sigoden@gmail.com>", "dufs developers"]
license = "Apache-2.0"
homepage = "https://github.com/isarmg/dufs-ram"
repository = "https://github.com/isarmg/dufs-ram"
publish = false
build = "build.rs"

[dependencies]
clap = { version = "4.5", features = ["wrap_help"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "net", "time"]}
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
hyper = { version = "1", features = ["http1", "server"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
headers = "0.4"
mime_guess = "2.0"
uuid = { version = "1.7", features = ["v4"] }
log = { version = "0.4", features = ["std"] }
socket2 = "0.6"
form_urlencoded = "1.2"
alphanumeric-sort = "1.4"
anyhow = "1.0"
rustix = { version = "1.1", features = ["event", "fs", "process", "time"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
base64 = "0.22"
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = "2"
http-body-util = "0.1"
bytes = "1.5"
getrandom = "0.4"
rpassword = "7"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sha2 = "0.11.0"
subtle = "2.6"
tempfile = "3"
sarmg-admin-auth = { version = "=0.3.1", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "7c6a210cd5fc8bf987e0f50fccee69b7c58cbdf0" }
sarmg-contracts = { version = "=0.3.1", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "7c6a210cd5fc8bf987e0f50fccee69b7c58cbdf0" }
sarmg-schema-identity = { version = "=0.3.1", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "7c6a210cd5fc8bf987e0f50fccee69b7c58cbdf0" }
sarmg-server-target = { version = "=0.3.1", git = "https://github.com/isarmg/sarmg-foundation.git", rev = "7c6a210cd5fc8bf987e0f50fccee69b7c58cbdf0" }

[dev-dependencies]
assert_cmd = "2"
reqwest = { version = "0.13", features = ["blocking"], default-features = false }
assert_fs = "1"
indexmap = "2.2"
rstest = "0.26.1"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
