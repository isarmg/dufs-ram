[package]
name = "dufs"
version = "0.47.0"
edition = "2024"
rust-version = "1.97.1"
description = "A Linux browser file manager"
publish = false
build = "build.rs"

[dependencies]
clap = { version = "4.5", features = ["wrap_help"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "net", "time"]}
tokio-util = { version = "0.7", default-features = false, features = ["io-util", "rt"] }
hyper = { version = "1", features = ["http1", "server"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
async-deflate-zip = "0.2.0"
headers = "0.4"
mime_guess = "2.0"
uuid = { version = "1.7", features = ["v4"] }
log = { version = "0.4", features = ["std"] }
socket2 = "0.6"
form_urlencoded = "1.2"
alphanumeric-sort = "1.4"
content_inspector = "0.2"
anyhow = "1.0"
argon2 = "0.5"
rustix = { version = "1.1", features = ["fs"] }
chardetng = "1.0"
glob = "0.3"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
base64 = "0.22"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
bytes = "1.5"
pin-project-lite = "0.2"
getrandom = "0.4"
rpassword = "7"
sha2 = "0.11.0"
hex = "0.4.3"
subtle = "2.6"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
reqwest = { version = "0.13", features = ["blocking"], default-features = false }
assert_fs = "1"
indexmap = "2.2"
rstest = "0.26.1"
url = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
