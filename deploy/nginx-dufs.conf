# Install this file inside nginx's `http {}` context, normally as
# /etc/nginx/conf.d/dufs.conf. Replace the hostname and certificate paths.
# Requires nginx >= 1.24.0 with the HTTP SSL and HTTP/2 modules, linked
# against an OpenSSL release still receiving upstream or vendor security
# updates. Prefer OpenSSL 3.5 LTS for a new deployment.

limit_req_zone $binary_remote_addr zone=dufs_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=dufs_login_connections:10m;

upstream dufs_backend {
    server 127.0.0.1:5000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name files.example.com;
    return 308 https://files.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.example.com;

    ssl_certificate /etc/dufs/tls/fullchain.pem;
    ssl_certificate_key /etc/dufs/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 100g;
    client_body_timeout 120s;
    send_timeout 1h;

    # The Foundation administrator contract has one exact login endpoint.
    # Keep this location exact so an unrelated path cannot consume or bypass
    # the credential-checking admission budget.
    location = /api/v2/auth/login {
        limit_req zone=dufs_login burst=5 nodelay;
        limit_req_status 429;
        limit_conn dufs_login_connections 4;
        limit_conn_status 429;
        client_max_body_size 4k;
        client_body_timeout 10s;
        proxy_pass http://dufs_backend;
        include /etc/nginx/snippets/dufs-proxy.conf;
    }

    location / {
        proxy_pass http://dufs_backend;
        include /etc/nginx/snippets/dufs-proxy.conf;
    }
}
